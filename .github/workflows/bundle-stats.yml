name: Bundle Stats

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  compare:
    permissions:
      contents: read
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve Node.js version
        id: node-version
        run: echo "value=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
  
      - uses: grafana/plugin-actions/bundle-size@bundle-size/v1.0.2
        with:
          node-version: ${{ steps.node-version.outputs.value }}
